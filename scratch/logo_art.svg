<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Icono">
  <rect width="64" height="64" rx="16" fill="#8B5E3C"/>
  <!-- Top bar: round left, square right -->
  <line x1="22" y1="18" x2="42" y2="18" stroke="#F7F1E8" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Bottom bar: square left, round right -->
  <line x1="22" y1="46" x2="42" y2="46" stroke="#F7F1E8" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Center: intersecting geometric vectors forming an iconic diamond aperture -->
  <path d="M32 18 L39 32 L32 46 L25 32 Z" fill="#F7F1E8"/>
  <circle cx="32" cy="32" r="2.5" fill="#8B5E3C"/>
  <!-- Vector anchor nodes on the corners -->
  <circle cx="22" cy="18" r="1" fill="#8B5E3C"/>
  <circle cx="42" cy="46" r="1" fill="#8B5E3C"/>
</svg>